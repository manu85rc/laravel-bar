version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_bar_app
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - laravel

  web:
    image: nginx:alpine
    container_name: laravel_bar_web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mariadb:10.6
    container_name: laravel_bar_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_bar
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel

  print-server:
    build:
      context: ./print-server
      dockerfile: Dockerfile
    container_name: laravel_bar_print
    devices:
    # - "/dev/usb/lp0:/dev/usb/lp0"
    # - "/dev/usb/lp1:/dev/usb/lp1"
    - "/dev/usb/lp2:/dev/usb/lp2"
    environment:
      - PRINT_SERVER_PORT=8080
    # ports:
    #   - "8090:8080"
    networks:
      - laravel
    restart: unless-stopped

networks:
  laravel:
    driver: bridge

volumes:
  dbdata:
